name: deploy-web

# Publishes ONLY the `web/` directory to GitHub Pages, so the site root is
# the newsletter builder itself and nothing else in the repository is
# served. The alternative (Pages from the branch root) would expose the
# whole tree and push the page down to `/web/`.
#
# The deploy is gated on the bundle-drift check. `web/meridian-bundle.zip`
# is a committed copy of `scripts/ templates/ locales/ images/`; if someone
# edits the toolkit and forgets `python web/build_bundle.py`, the desktop
# launcher gets the fix while the page keeps running the old code. Failing
# here means the live site stays on the last good version instead of
# quietly serving something stale.

on:
  push:
    branches: [main]
    paths:
      # The page itself, and everything the bundle is built from -- a
      # source change with no bundle refresh must fail the gate rather
      # than skip it.
      - 'web/**'
      - 'scripts/**'
      - 'templates/**'
      - 'locales/**'
      - 'images/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, and never cancel one midway -- a
# half-finished Pages deploy is a broken page for whoever loads it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Stdlib only -- no `pip install` needed.
      - name: Refuse to publish a bundle that has drifted from scripts/
        run: python web/build_bundle.py --verify

  deploy:
    needs: verify-bundle
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The Pyodide runtime is served from our own origin so the page's
      # CSP can be `script-src 'self'` -- see web/vendor_pyodide.py for
      # why that matters. ~16 MB, so it is fetched here rather than
      # committed, and every byte is checked against the SHA-256 hashes
      # in web/pyodide-assets.json. A mismatch fails the deploy and the
      # live site stays on the last good version.
      - name: Vendor the Pyodide runtime (hash-verified)
        run: python web/vendor_pyodide.py
      # Stamp the service worker with this commit. The bytes of sw.js
      # change on every deploy, so the browser installs the new worker
      # and `activate` drops every previous cache -- which is what stops
      # a stale `meridian-bundle.zip` outliving a release.
      - name: Version the service worker
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("web/sw.js")
          s = p.read_text(encoding="utf-8")
          assert "__MERIDIAN_VERSION__" in s, "sw.js version placeholder is gone"
          p.write_text(s.replace("__MERIDIAN_VERSION__", "${{ github.sha }}"),
                       encoding="utf-8")
          print("sw.js stamped with ${{ github.sha }}")
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
